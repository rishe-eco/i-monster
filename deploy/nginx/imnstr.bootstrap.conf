# IMNSTR.com, port 80 only: used once, to get the first certificate. It has
# no ssl_certificate lines, because the certificate does not exist yet and
# `nginx -t` refuses a config that points at a missing file. It declares no
# limit_req_zone, so it never clashes with imnstr.conf. Swap it for
# imnstr.conf as deploy/README.md says. No default_server, as in imnstr.conf.
server {
    listen 80;
    listen [::]:80;
    server_name imnstr.com www.imnstr.com;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
