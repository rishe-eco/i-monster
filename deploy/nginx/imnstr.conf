# IMNSTR.com, the final TLS config: /etc/nginx/sites-available/imnstr, linked
# from sites-enabled. Needs the certificate from the first-time setup
# (deploy/README.md); before it exists, use imnstr.bootstrap.conf instead.
#
# Nginx 1.18 on the shared box: `listen 443 ssl http2`, not `http2 on`.
# No default_server: the box's other sites own unknown hosts, and this file
# must not change that. No add_header: the app sets every header itself (PD-18).
# TRUST_PROXY does not apply: the app never reads the client address.

# The name starts imnstr_ because zone names are shared across the whole box,
# and a duplicate fails `nginx -t` for every site on it.
limit_req_zone $binary_remote_addr zone=imnstr_auth:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name imnstr.com www.imnstr.com;

    # certbot renews over port 80 with the nginx plugin; nothing else is served here.
    return 301 https://imnstr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.imnstr.com;

    ssl_certificate     /etc/letsencrypt/live/imnstr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imnstr.com/privkey.pem;

    return 301 https://imnstr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imnstr.com;

    ssl_certificate     /etc/letsencrypt/live/imnstr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imnstr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:imnstr_tls:1m;
    ssl_session_timeout 1d;

    # The spec promises no access log (§5, "server logs"). Crashes still
    # land in the error log, at crit only.
    access_log off;
    error_log /var/log/nginx/imnstr-error.log crit;

    client_max_body_size 1m;

    # Sign-in attempts. B4a puts routes here; the limit is ready for them.
    location /admin/api/auth/ {
        limit_req zone=imnstr_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
